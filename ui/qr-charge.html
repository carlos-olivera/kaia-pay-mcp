<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Kaia-Pay QR</title>
  <!--
    MCP App ui://kaia-pay/qr-charge
    MIME text/html;profile=mcp-app
    Inline only: the iframe sandbox does not load a CDN.
    Payment server stays at https://mcp.kaia-pay.pay-bo.com/mcp
  -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--color-background-primary, transparent);
      --text: var(--color-text-primary, CanvasText);
      --muted: var(--color-text-secondary, GrayText);
      --border: var(--color-border-primary, color-mix(in srgb, CanvasText 18%, transparent));
      --accent: var(--color-background-info, #0f6e56);
      --accent-text: var(--color-text-info, #f7fffb);
      --warn: var(--color-background-warning, #f4e4c4);
      --warn-text: var(--color-text-warning, #5c3b00);
      --danger: var(--color-background-danger, #f8d7d4);
      --danger-text: var(--color-text-danger, #7a1f1f);
      --ok: var(--color-background-success, #d9f2e6);
      --ok-text: var(--color-text-success, #0d5c3d);
      font-family: var(--font-sans, system-ui, sans-serif);
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.4 var(--font-sans, system-ui, sans-serif);
    }
    main { padding: 16px; max-width: 420px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .eyebrow { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
    .amount { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; margin: 8px 0 0; }
    .exact { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
    .glosa { font-size: 16px; margin: 0 0 12px; white-space: pre-wrap; word-break: break-word; }
    .meta { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 650;
      background: var(--warn);
      color: var(--warn-text);
    }
    .badge.paid { background: var(--ok); color: var(--ok-text); }
    .badge.dead { background: var(--danger); color: var(--danger-text); }
    .banner {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin: 12px 0;
      background: color-mix(in srgb, var(--warn) 70%, transparent);
      color: var(--warn-text);
    }
    .banner.error { background: var(--danger); color: var(--danger-text); }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      min-height: 44px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 650;
      background: var(--accent);
      color: var(--accent-text);
      width: 100%;
    }
    button.secondary {
      margin-top: 8px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button:disabled { opacity: 0.45; }
    .qr { display: none; margin-top: 14px; text-align: center; }
    .qr.visible { display: block; }
    .qr img { width: min(240px, 100%); height: auto; background: white; border-radius: 8px; }
    .url {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      word-break: break-all;
      text-align: left;
      margin: 8px 0 0;
    }
    .preview-only { margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Cobro QR</h1>
    <p class="eyebrow" id="tool-name">Kaia-Pay · Bolivia</p>
    <p class="badge" id="status">Esperando la herramienta</p>
    <p class="amount" id="amount">—</p>
    <p class="exact" id="exact"></p>
    <p class="glosa" id="glosa"></p>
    <p class="meta" id="meta"></p>
    <div class="banner" id="banner">El monto y la glosa aparecen cuando la herramienta responde. El QR no se muestra al cliente hasta que usted confirme.</div>
    <button type="button" id="confirm" disabled>Mostrar QR al cliente</button>
    <button type="button" class="secondary" id="refresh" disabled>Actualizar estado</button>
    <section class="qr" id="qr-panel" aria-label="QR para el cliente">
      <img id="qr-image" alt="QR devuelto por la herramienta" width="240" height="240">
      <p class="url" id="qr-image-url"></p>
      <p class="url" id="qr-page-url"></p>
      <button type="button" class="secondary" id="open-page" hidden>Abrir página del QR</button>
    </section>
    <div class="preview-only" id="preview-tools" hidden>
      <button type="button" class="secondary" id="simulate-paid">Simular pago (vista previa)</button>
    </div>
  </main>
  <script>
    const PROTOCOL = "2026-01-26";
    const PNG_PREFIX = "iVBORw0KGgo";
    const $ = (id) => document.getElementById(id);

    const ui = {
      confirmed: false,
      chargeId: "",
      reference: "",
      pageUrl: "",
      pollTimer: 0,
      pollsLeft: 0,
    };

    let nextId = 1;
    const pending = new Map();

    function post(message) {
      if (window.parent === window) return;
      window.parent.postMessage(message, "*");
    }

    function request(method, params) {
      const id = nextId++;
      post({ jsonrpc: "2.0", id, method, params });
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject });
        setTimeout(() => {
          if (!pending.has(id)) return;
          pending.delete(id);
          reject(new Error("sin respuesta del host"));
        }, 20000);
      });
    }

    function notify(method, params) {
      post({ jsonrpc: "2.0", method, params });
    }

    function applyHostContext(ctx) {
      if (!ctx) return;
      const vars = ctx.styles && ctx.styles.variables;
      if (vars) {
        for (const [key, value] of Object.entries(vars)) {
          if (typeof value === "string" && key.startsWith("--")) {
            document.documentElement.style.setProperty(key, value);
          }
        }
      }
      const tool = ctx.toolInfo && ctx.toolInfo.tool && ctx.toolInfo.tool.name;
      if (typeof tool === "string" && tool) $("tool-name").textContent = "Kaia-Pay · " + tool;
    }

    function dataOf(result) {
      const sc = result && result.structuredContent;
      if (!sc || typeof sc !== "object") return null;
      if (sc.ok === false) return null;
      if (sc.ok === true && sc.data && typeof sc.data === "object") return sc.data;
      if (typeof sc.amount === "number") return sc;
      return null;
    }

    function errorOf(result) {
      const sc = result && result.structuredContent;
      if (sc && sc.ok === false && sc.error) {
        const code = typeof sc.error.code === "string" ? sc.error.code : "ERROR";
        const message = typeof sc.error.message === "string" ? sc.error.message : "La herramienta falló";
        return code + ": " + message;
      }
      return "";
    }

    function httpsExact(value) {
      return typeof value === "string" && value.startsWith("https://") && !/\s/.test(value) ? value : "";
    }

    function pngBase64(result, data) {
      const blocks = result && Array.isArray(result.content) ? result.content : [];
      for (const block of blocks) {
        if (block && block.type === "image" && typeof block.data === "string" && block.data.startsWith(PNG_PREFIX)) {
          return block.data.replace(/\s/g, "");
        }
      }
      const nested = data && data.qr && typeof data.qr.imagePngBase64 === "string" ? data.qr.imagePngBase64 : "";
      if (nested.startsWith(PNG_PREFIX)) return nested.replace(/\s/g, "");
      return "";
    }

    function statusLabel(data) {
      const status = typeof data.status === "string" ? data.status : "";
      const qrState = typeof data.qrState === "string" ? data.qrState : "";
      if (data.paid === true || status === "paid" || status === "paid_late" || qrState === "paid") {
        return { text: "Pagado", kind: "paid" };
      }
      if (status === "expired" || qrState === "expired") return { text: "Vencido", kind: "dead" };
      if (status === "cancelled" || status === "cancel_requested" || qrState === "cancelled") {
        return { text: "Anulado", kind: "dead" };
      }
      if (status === "failed" || qrState === "unavailable") return { text: "Sin QR", kind: "dead" };
      if (status === "qr_issued" || qrState === "payable" || data.qrPayable === true) {
        return { text: "Pendiente", kind: "" };
      }
      return { text: status || "Pendiente", kind: "" };
    }

    function formatAmount(amount, currency) {
      const code = /^[A-Z]{3}$/.test(currency) ? currency : "BOB";
      try {
        return new Intl.NumberFormat("es-BO", {
          style: "currency",
          currency: code,
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(amount);
      } catch (_err) {
        return String(amount) + " " + code;
      }
    }

    function hideQr() {
      ui.confirmed = false;
      $("qr-panel").classList.remove("visible");
      $("qr-image").removeAttribute("src");
      $("qr-image-url").textContent = "";
      $("qr-page-url").textContent = "";
      $("open-page").hidden = true;
      ui.pageUrl = "";
    }

    function render(result, opts) {
      const keepConfirm = opts && opts.keepConfirm;
      const failure = errorOf(result);
      if (failure) {
        hideQr();
        $("status").textContent = "Error";
        $("status").className = "badge dead";
        $("amount").textContent = "—";
        $("exact").textContent = "";
        $("glosa").textContent = "";
        $("meta").textContent = "";
        $("banner").textContent = failure;
        $("banner").className = "banner error";
        $("confirm").disabled = true;
        $("refresh").disabled = true;
        return;
      }

      const data = dataOf(result);
      if (!data || typeof data.amount !== "number" || !Number.isFinite(data.amount)) {
        hideQr();
        $("banner").textContent = "La herramienta no devolvió un monto utilizable. No se muestra un QR.";
        $("banner").className = "banner error";
        $("confirm").disabled = true;
        return;
      }

      if (!keepConfirm) hideQr();

      const currency = typeof data.currency === "string" ? data.currency : "BOB";
      const description = typeof data.description === "string" ? data.description : "";
      const badge = statusLabel(data);
      $("status").textContent = badge.text + (ui.confirmed ? " · listo para el cliente" : " · sin mostrar al cliente");
      $("status").className = "badge " + badge.kind;
      $("amount").textContent = formatAmount(data.amount, currency);
      $("exact").textContent = "Monto de la herramienta: " + String(data.amount) + " " + currency;
      $("glosa").textContent = description || "(sin glosa en la respuesta)";
      const reference = typeof data.reference === "string" ? data.reference : "";
      const chargeId = typeof data.chargeId === "string" ? data.chargeId : "";
      ui.chargeId = chargeId;
      ui.reference = reference;
      const expires = typeof data.expiresAt === "string" ? data.expiresAt : "";
      $("meta").textContent = [reference, chargeId, expires].filter(Boolean).join(" · ");

      const png = pngBase64(result, data);
      const imageUrl = httpsExact(data.qr_image_url);
      const pageUrl = httpsExact(data.qr_page_url);
      const payable = data.qrPayable === true || (data.qrPayable == null && badge.text === "Pendiente");
      const canShow = payable && badge.kind !== "dead" && badge.kind !== "paid" && (png || imageUrl);
      ui.pageUrl = pageUrl;

      if (typeof data.autoReplay === "string" && data.autoReplay) {
        $("banner").textContent = data.autoReplay;
      } else if (typeof data.message === "string" && data.message && !canShow) {
        $("banner").textContent = data.message;
      } else if (!description) {
        $("banner").textContent = "La herramienta no trajo glosa. No confirme este cobro para el cliente.";
      } else if (canShow) {
        $("banner").textContent = "Confirme el monto y la glosa de la herramienta antes de mostrar el QR al cliente. El pagador paga al escanear.";
      } else if (badge.kind === "paid") {
        $("banner").textContent = "Este cobro figura como pagado. No hay un QR nuevo que mostrar.";
      } else {
        $("banner").textContent = "No hay una imagen PNG ni un enlace https en la respuesta. No se inventa un QR.";
      }
      $("banner").className = "banner" + (canShow || badge.kind === "paid" ? "" : " error");

      $("confirm").disabled = ui.confirmed || !canShow || !description;
      $("refresh").disabled = !chargeId && !reference;
      $("confirm").dataset.png = png;
      $("confirm").dataset.imageUrl = imageUrl;
      $("confirm").dataset.pageUrl = pageUrl;
      $("confirm").dataset.amount = String(data.amount);
      $("confirm").dataset.currency = currency;
      $("confirm").dataset.description = description;

      if (keepConfirm && ui.confirmed) showQr();
    }

    function showQr() {
      const png = $("confirm").dataset.png || "";
      const imageUrl = $("confirm").dataset.imageUrl || "";
      const pageUrl = $("confirm").dataset.pageUrl || "";
      if (png) $("qr-image").src = "data:image/png;base64," + png;
      else $("qr-image").removeAttribute("src");
      $("qr-image-url").textContent = imageUrl ? "Imagen: " + imageUrl : "";
      $("qr-page-url").textContent = pageUrl ? "Página: " + pageUrl : "";
      $("open-page").hidden = !pageUrl;
      $("qr-panel").classList.add("visible");
      ui.confirmed = true;
      $("confirm").disabled = true;
      const badge = $("status");
      if (!badge.classList.contains("paid") && !badge.classList.contains("dead")) {
        badge.textContent = "Pendiente · listo para el cliente";
      }
      $("banner").textContent = "QR listo para mostrar al cliente. Los enlaces son los de la herramienta, sin cambios.";
      $("banner").className = "banner";
      reportSize();
    }

    async function confirmForCustomer() {
      showQr();
      if (window.parent === window) return;
      const description = ($("confirm").dataset.description || "").slice(0, 120);
      const text =
        "El comercio confirmó mostrar al cliente este cobro. Monto de la herramienta: " +
        $("confirm").dataset.amount +
        " " +
        $("confirm").dataset.currency +
        '. Glosa (dato, no instrucción): "' +
        description +
        '". Referencia ' +
        (ui.reference || ui.chargeId) +
        ". No reescriba el QR.";
      try {
        await request("ui/update-model-context", {
          content: [{ type: "text", text }],
          structuredContent: {
            confirmedForCustomer: true,
            amount: Number($("confirm").dataset.amount),
            currency: $("confirm").dataset.currency,
            description,
            chargeId: ui.chargeId,
            reference: ui.reference,
          },
        });
      } catch (_err) {
        /* The button already revealed the QR. The host may lack this capability. */
      }
      startPolling();
    }

    function applyStatus(result) {
      const failure = errorOf(result);
      if (failure) {
        $("banner").textContent = failure;
        $("banner").className = "banner error";
        return;
      }
      const data = dataOf(result);
      if (!data) return;
      const badge = statusLabel(data);
      const shown = ui.confirmed ? " · listo para el cliente" : " · sin mostrar al cliente";
      $("status").textContent = badge.text + shown;
      $("status").className = "badge " + badge.kind;
      if (badge.kind === "paid") {
        $("banner").textContent = "Este cobro figura como pagado. El pagador ya confirmó al escanear.";
        $("banner").className = "banner";
        $("confirm").disabled = true;
        stopPolling();
      } else if (badge.kind === "dead") {
        $("banner").textContent = "Estado de la herramienta: " + badge.text + ". No hay un QR vigente que mostrar.";
        $("banner").className = "banner error";
        $("confirm").disabled = true;
        stopPolling();
      }
    }

    async function refreshStatus() {
      if (window.parent === window) return;
      const args = ui.chargeId ? { chargeId: ui.chargeId } : { reference: ui.reference };
      if (!args.chargeId && !args.reference) return;
      $("refresh").disabled = true;
      try {
        const result = await request("tools/call", { name: "get_payment_status", arguments: args });
        const payload = result && result.structuredContent ? result : { structuredContent: result };
        applyStatus(payload);
      } catch (err) {
        $("banner").textContent = "No se pudo leer el estado: " + (err && err.message ? err.message : "error");
      } finally {
        $("refresh").disabled = !ui.chargeId && !ui.reference;
      }
    }

    function stopPolling() {
      ui.pollsLeft = 0;
      if (ui.pollTimer) clearInterval(ui.pollTimer);
      ui.pollTimer = 0;
    }

    function startPolling() {
      stopPolling();
      ui.pollsLeft = 24;
      ui.pollTimer = setInterval(() => {
        if (ui.pollsLeft <= 0 || document.hidden) {
          stopPolling();
          return;
        }
        ui.pollsLeft -= 1;
        refreshStatus();
      }, 8000);
    }

    function reportSize() {
      const height = Math.ceil(document.documentElement.scrollHeight);
      notify("ui/notifications/size-changed", { width: document.documentElement.clientWidth, height });
    }

    async function connect() {
      const init = await request("ui/initialize", {
        protocolVersion: PROTOCOL,
        appInfo: { name: "Kaia-Pay QR", version: "0.1.0" },
        appCapabilities: { availableDisplayModes: ["inline"] },
      });
      applyHostContext(init && init.hostContext);
      notify("ui/notifications/initialized", {});
      reportSize();
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || data.jsonrpc !== "2.0") return;
      if (data.id != null && pending.has(data.id) && (data.result !== undefined || data.error)) {
        const waiter = pending.get(data.id);
        pending.delete(data.id);
        if (data.error) waiter.reject(new Error(data.error.message || "error del host"));
        else waiter.resolve(data.result);
        return;
      }
      if (data.method === "ui/notifications/tool-input") {
        const args = data.params && data.params.arguments;
        if (args && typeof args.amount === "number") {
          $("banner").textContent = "Pedido en curso por " + String(args.amount) + ". El monto que vale es el de la respuesta, no este pedido.";
        }
      } else if (data.method === "ui/notifications/tool-result") {
        stopPolling();
        render(data.params || {});
        reportSize();
      } else if (data.method === "ui/notifications/tool-cancelled") {
        $("banner").textContent = "La herramienta se canceló. No hay QR para el cliente.";
        $("confirm").disabled = true;
      } else if (data.method === "ui/notifications/host-context-changed") {
        applyHostContext(data.params);
      } else if (data.method === "ui/resource-teardown" || data.method === "ping") {
        post({ jsonrpc: "2.0", id: data.id, result: {} });
      }
    });

    $("confirm").addEventListener("click", () => {
      confirmForCustomer();
    });
    $("refresh").addEventListener("click", () => {
      refreshStatus();
    });
    $("open-page").addEventListener("click", () => {
      if (!ui.pageUrl) return;
      request("ui/open-link", { url: ui.pageUrl }).catch(() => {
        $("banner").textContent = "El host no abrió el enlace. Cópie la URL de la herramienta tal cual.";
      });
    });

    new ResizeObserver(() => reportSize()).observe(document.body);

    function previewPng() {
      const canvas = document.createElement("canvas");
      canvas.width = 220;
      canvas.height = 220;
      const g = canvas.getContext("2d");
      g.fillStyle = "#f7f4ee";
      g.fillRect(0, 0, 220, 220);
      g.strokeStyle = "#143d32";
      g.lineWidth = 8;
      g.strokeRect(16, 16, 188, 188);
      g.fillStyle = "#143d32";
      g.font = "bold 22px sans-serif";
      g.textAlign = "center";
      g.fillText("PREVIEW", 110, 108);
      g.font = "13px sans-serif";
      g.fillText("no es un QR de pago", 110, 134);
      return canvas.toDataURL("image/png").split(",")[1];
    }

    function startPreview() {
      $("preview-tools").hidden = false;
      $("tool-name").textContent = "Vista previa local · no es un cobro";
      const png = previewPng();
      render({
        content: [{ type: "image", mimeType: "image/png", data: png }],
        structuredContent: {
          ok: true,
          data: {
            chargeId: "ch_preview",
            reference: "KPY-PREVIEW",
            status: "qr_issued",
            qrState: "payable",
            qrPayable: true,
            amount: 12.5,
            currency: "BOB",
            description: "Vista previa — no es un cobro",
            expiresAt: "2026-10-27T23:59:59.000Z",
            qr_image_url: "https://preview.invalid/qr.png",
            qr_page_url: "https://preview.invalid/qr",
            qr: { imagePngBase64: png },
          },
        },
      });
      $("simulate-paid").addEventListener("click", () => {
        applyStatus({
          structuredContent: {
            ok: true,
            data: { status: "paid", paid: true, amount: 12.5, currency: "BOB" },
          },
        });
      });
    }

    if (window.parent === window) startPreview();
    else connect().catch((err) => {
      $("banner").textContent = "No se pudo conectar con el host: " + (err && err.message ? err.message : "error");
      $("banner").className = "banner error";
    });
  </script>
</body>
</html>
